<!DOCTYPE html>
<html>
<head>
    <title>Payment Successful</title>
</head>
<body>

    <h1>Payment Successful</h1>

    <p>Thank you for your payment.</p>

    <p>Your CSV cleaning job has been paid for and is ready for processing.</p>

    <p><strong>Job ID:</strong> {{ job_id }}</p>

    <p><strong>Cleaning Mode:</strong> {{ mode }}</p>

    <p><strong>Validation Strictness:</strong> {{ strictness }}</p>

    <form action="/process/{{ job_id }}" method="post">

        <button type="submit">
            Process My File
        </button>

    </form>

</body>
</html>
