<!DOCTYPE html>
<html>
<head>
    <title>Glynn Cleaner</title>
</head>
<body>

    <h1>Glynn Cleaner</h1>

    <h2>CSV Data Cleaning Service</h2>

    <p>Upload a CSV file and receive a cleaning quote.</p>

    <form action="/quote" method="post" enctype="multipart/form-data">

        <p>
            <input type="file" name="file" required>
        </p>

        <h3>Cleaning Mode</h3>

        <p>
            <input type="radio" id="simple" name="mode" value="simple" checked>
            <label for="simple">Simple</label>
        </p>

        <p>
            <input type="radio" id="audit" name="mode" value="audit">
            <label for="audit">Audit</label>
        </p>

        <h3>Validation Strictness</h3>

        <p>
            <input type="radio" id="strict" name="strictness" value="strict" checked>
            <label for="strict">Strict</label>
        </p>

        <p>
            <input type="radio" id="lenient" name="strictness" value="lenient">
            <label for="lenient">Lenient</label>
        </p>

        <button type="submit">
            Get Quote
        </button>

    </form>

</body>
</html>
